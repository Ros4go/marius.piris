<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="chair-base" content="/src/modules/games/chair">
  <title>CHAIR</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/scene.css">
  <link rel="stylesheet" href="styles/scenes.css">
  <link rel="stylesheet" href="styles/hud.css">
</head>
<body>

<!-- Portrait warning -->
<div class="rotate">
  <div>
    <span style="font-size:2.2rem">⟳</span><br>
    pivote ton téléphone<br>
    <em>CHAIR se joue en paysage</em>
  </div>
</div>

<div class="game" id="chair-app" data-biome="gorge">
  <!-- Grain + heartpulse overlays -->
  <div class="grain" aria-hidden="true"></div>
  <div class="heartpulse" aria-hidden="true"></div>
  <!-- Corner marks -->
  <span class="fc tl" aria-hidden="true">✛</span>
  <span class="fc tr" aria-hidden="true">✛</span>
  <span class="fc bl" aria-hidden="true">✛</span>
  <span class="fc br" aria-hidden="true">✛</span>

  <!-- ══ HEADER ══════════════════════════════════════════════════════════════ -->
  <header class="game-h">
    <span class="title"><em>☩ </em>C H A I R<b> †</b></span>
    <span class="hdo" aria-hidden="true"></span>
    <span class="loc" id="hud-floor">LA GORGE · ÉTAGE <b>1</b> · TICK <b>0</b></span>
    <span class="hctl" style="position:relative">
      <button id="settings-btn" aria-pressed="false" title="réglages">⚙</button>
      <button id="save-btn" title="Exporter la sauvegarde (JSON)">⇩ SAVE</button>
      <button id="import-btn" title="Importer une sauvegarde">⇧</button>
      <div class="menu panel" id="settings-menu" style="display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:60;width:200px">
        <h3><i>⚙</i> Réglages</h3>
        <div style="font:.6rem var(--mono);color:#6a5d48;padding:6px 2px">son <button id="sound-toggle" style="font:.56rem var(--mono);background:#0b0807;color:#6a5d48;border:1px solid #2a1f14;padding:2px 7px;cursor:pointer;margin-left:4px">off</button></div>
      </div>
    </span>
    <input type="file" id="import-file" accept=".json,application/json" style="display:none">
  </header>

  <!-- ══ COLONNE GAUCHE — Besace + Carte ═════════════════════════════════════ -->
  <aside class="col-l">

    <!-- Besace (2×3 inventory grid, 6 cells) -->
    <div class="panel">
      <h3><i>❖</i> Besace</h3>
      <!-- cellules injectées par ViewportDOM.js (source unique, partagée avec l'atelier) -->
      <div class="inv" id="inventory-grid"></div>
      <div class="suture" style="margin:9px 0 7px"></div>
      <div class="counters">
        <span>viande &nbsp;<b id="val-gold">0</b></span>
        <span>torches <span id="val-torches"><b>▮▮▮</b><span class="dim">▮▮</span></span></span>
        <span>faim &nbsp;&nbsp;&nbsp;<b id="val-hunger" class="hunger-rassasie">Rassasié</b></span>
      </div>
    </div>

    <!-- Carte (CSS-grid minimap) -->
    <div class="panel grow">
      <h3><i>✠</i> Carte</h3>
      <!-- contenu injecté par ViewportDOM.js (source unique, partagée avec l'atelier) -->
      <div class="map-wrap"></div>
    </div>

    <!-- Journal (combat / événements) -->
    <div class="panel" id="log-panel">
      <h3><i>✶</i> Journal</h3>
      <div class="log" id="combat-log" aria-live="polite" aria-atomic="false"></div>
    </div>

  </aside>

  <!-- ══ CENTRE — Viewport + Log + Room panel ════════════════════════════════ -->
  <main class="center">

    <!-- First-person viewport — squelette injecté par ViewportDOM.js (source unique, partagé avec l'atelier) -->
    <div class="viewport"></div>

  </main>

  <!-- ══ COLONNE DROITE — Ton corps + Inspection ═════════════════════════════ -->
  <aside class="col-r">

    <!-- Ton corps — silhouette humanoïde + organes (PV en un coup d'œil), ReactorPanel.js -->
    <div class="panel grow">
      <h3><i>†</i> Ton corps</h3>
      <div class="reactor" id="reactor"></div>
    </div>

    <!-- Inspection panel (compact) -->
    <div class="panel inspector" id="inspector-panel">
      <h3><i>✦</i> Inspection</h3>
      <div id="insp-content">
        <div class="hint">clique un organe</div>
      </div>
    </div>

  </aside>

  <!-- ══ YOUBAR — Actions + Pad ══════════════════════════════════════════════ -->
  <div class="youbar">
    <!-- Action buttons (rendered by ActionBar.js) -->
    <div id="action-bar" style="display:flex;flex:1;gap:5px;max-width:none"></div>
    <!-- Suture divider -->
    <span class="ybdiv" aria-hidden="true"></span>
    <!-- Touch movement pad (3×2 grid) -->
    <div class="padmini" id="padmini" title="se déplacer = 1 tick · fuir = reculer">
      <button class="pad-btn" data-action="TURN_LEFT"     style="grid-column:1;grid-row:1" aria-label="Tourner gauche">↺</button>
      <button class="pad-btn" data-action="MOVE_FORWARD"  style="grid-column:2;grid-row:1" aria-label="Avancer">↑</button>
      <button class="pad-btn" data-action="TURN_RIGHT"    style="grid-column:3;grid-row:1" aria-label="Tourner droite">↻</button>
      <button class="pad-btn" data-action="STRAFE_LEFT"   style="grid-column:1;grid-row:2" aria-label="Pas gauche">←</button>
      <button class="pad-btn" data-action="MOVE_BACK"     style="grid-column:2;grid-row:2" aria-label="Reculer">↓</button>
      <button class="pad-btn" data-action="STRAFE_RIGHT"  style="grid-column:3;grid-row:2" aria-label="Pas droite">→</button>
    </div>
  </div>

</div><!-- /.game -->

<!-- Start screen overlay -->
<div id="start-screen" class="start-screen">
  <div class="start-inner">
    <p class="start-title">C H A I R <span>†</span></p>
    <p class="start-sub">les entrailles du dieu mort</p>
    <div id="start-grave" class="start-grave"></div>
    <button id="start-btn" class="act start-btn">DESCENDRE</button>
  </div>
</div>

<script type="module">
  // Le DOM du viewport et des panneaux DOIT exister avant l'évaluation des
  // modules du jeu (certains capturent des éléments à l'import). Les module
  // scripts s'exécutent dans l'ordre du document : celui-ci d'abord, main.js ensuite.
  import { build, buildInto, INVENTORY_CELLS_HTML, MINIMAP_WRAP_HTML } from './src/render/ViewportDOM.js';
  build(document.querySelector('.viewport'));
  buildInto(document.getElementById('inventory-grid'), INVENTORY_CELLS_HTML);
  buildInto(document.querySelector('.map-wrap'), MINIMAP_WRAP_HTML);
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
